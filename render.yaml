services:
  - type: web
    name: memebot-desk
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: HELIUS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: STATE_REPO
        sync: false
      - key: SOLANATRACKER_API_KEY   # free plan; hype sniper polls trending once per 30 min
        sync: false
      - key: HYPE                    # set to 0 to disable the hype sniper process
        value: "1"
